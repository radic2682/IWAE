<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">IWAE workspace overview</title>
  <desc id="description">A vault sidebar, document reader, and connected note canvas presented in one desktop workspace.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1440" height="720" rx="36" fill="url(#background)"/>
  <circle cx="1280" cy="120" r="180" fill="#2563eb" opacity="0.13"/>
  <circle cx="170" cy="620" r="220" fill="#06b6d4" opacity="0.10"/>

  <text x="72" y="78" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700">Read. Capture. Connect.</text>
  <text x="72" y="116" fill="#a5b4fc" font-family="Inter, Segoe UI, sans-serif" font-size="18">Evidence stays linked to its source while your ideas take shape.</text>

  <g transform="translate(70 154)" filter="url(#shadow)">
    <rect width="1300" height="500" rx="22" fill="#f8fafc"/>
    <rect width="1300" height="46" rx="22" fill="#e2e8f0"/>
    <rect y="24" width="1300" height="22" fill="#e2e8f0"/>
    <circle cx="24" cy="23" r="6" fill="#f87171"/>
    <circle cx="44" cy="23" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="23" r="6" fill="#34d399"/>
    <text x="650" y="29" text-anchor="middle" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600">IWAE</text>

    <g transform="translate(0 46)">
      <rect width="230" height="454" fill="#f1f5f9"/>
      <line x1="230" y1="0" x2="230" y2="454" stroke="#cbd5e1"/>
      <text x="22" y="38" fill="#0f172a" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">VAULT</text>
      <rect x="14" y="55" width="202" height="38" rx="9" fill="#dbeafe"/>
      <circle cx="29" cy="74" r="4" fill="#2563eb"/>
      <text x="42" y="79" fill="#1e3a8a" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600">Research Paper.pdf</text>
      <text x="22" y="125" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">DOCUMENTS</text>
      <text x="42" y="155" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="13">Protocol Notes.md</text>
      <text x="42" y="184" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="13">Paper.pdf</text>
      <text x="22" y="230" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">NOTES</text>
      <text x="42" y="260" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="13">Architecture Map</text>
      <text x="42" y="289" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="13">Open Questions</text>
      <rect x="14" y="400" width="202" height="38" rx="9" fill="#e2e8f0"/>
      <text x="28" y="424" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="12">Local vault · Autosaved</text>
    </g>

    <g transform="translate(230 46)">
      <rect width="530" height="454" fill="#e2e8f0"/>
      <rect x="16" y="14" width="498" height="38" rx="10" fill="#ffffff"/>
      <circle cx="35" cy="33" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="40" y1="38" x2="45" y2="43" stroke="#64748b" stroke-width="2"/>
      <text x="58" y="38" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">Search this document</text>
      <rect x="16" y="66" width="498" height="372" rx="4" fill="#ffffff" filter="url(#cardShadow)"/>
      <text x="265" y="104" text-anchor="middle" fill="#334155" font-family="Georgia, serif" font-size="12">Research Paper · Page 12</text>
      <rect x="64" y="130" width="395" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="64" y="151" width="360" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="64" y="172" width="410" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="64" y="193" width="300" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="58" y="220" width="420" height="68" rx="5" fill="#bfdbfe" opacity="0.72"/>
      <rect x="64" y="231" width="388" height="10" rx="3" fill="#475569"/>
      <rect x="64" y="252" width="334" height="10" rx="3" fill="#475569"/>
      <rect x="64" y="273" width="372" height="10" rx="3" fill="#475569"/>
      <rect x="64" y="315" width="382" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="64" y="336" width="410" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="64" y="357" width="325" height="10" rx="3" fill="#cbd5e1"/>
      <rect x="358" y="300" width="112" height="30" rx="15" fill="url(#accent)"/>
      <text x="414" y="320" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">CAPTURE</text>
    </g>

    <g transform="translate(760 46)">
      <rect width="540" height="454" fill="#f8fafc"/>
      <rect width="540" height="454" fill="url(#dots)"/>
      <rect x="16" y="14" width="508" height="38" rx="10" fill="#ffffff"/>
      <text x="34" y="38" fill="#334155" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Canvas tools</text>
      <text x="486" y="38" text-anchor="end" fill="#16a34a" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">SAVED</text>

      <path d="M90 165 C160 120 184 114 244 142" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="7 6"/>
      <path d="M320 180 C365 210 372 270 420 292" fill="none" stroke="#64748b" stroke-width="3"/>
      <path d="M242 240 C225 292 187 310 152 333" fill="none" stroke="#06b6d4" stroke-width="3"/>

      <g filter="url(#cardShadow)">
        <rect x="40" y="104" width="194" height="88" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
        <text x="56" y="130" fill="#0f172a" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Source excerpt</text>
        <rect x="56" y="143" width="150" height="7" rx="3" fill="#94a3b8"/>
        <rect x="56" y="158" width="122" height="7" rx="3" fill="#cbd5e1"/>
        <text x="56" y="182" fill="#2563eb" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700">REF · PAGE 12</text>
      </g>

      <g filter="url(#cardShadow)">
        <rect x="244" y="118" width="208" height="98" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
        <text x="262" y="148" fill="#78350f" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Key interpretation</text>
        <text x="262" y="172" fill="#92400e" font-family="Inter, Segoe UI, sans-serif" font-size="11">Connect the claim to the</text>
        <text x="262" y="190" fill="#92400e" font-family="Inter, Segoe UI, sans-serif" font-size="11">evidence and related notes.</text>
      </g>

      <g filter="url(#cardShadow)">
        <rect x="72" y="310" width="184" height="82" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
        <text x="90" y="340" fill="#164e63" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Translated block</text>
        <text x="90" y="364" fill="#155e75" font-family="Inter, Segoe UI, sans-serif" font-size="11">Separate, linked, editable.</text>
      </g>

      <g filter="url(#cardShadow)">
        <rect x="352" y="278" width="150" height="104" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
        <text x="370" y="308" fill="#0f172a" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Question</text>
        <text x="370" y="333" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="11">What changes if this</text>
        <text x="370" y="351" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="11">assumption is false?</text>
      </g>
    </g>
  </g>
</svg>
