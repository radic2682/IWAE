[package]
name = "iwae-setup"
version = "0.2.6"
description = "IWAE setup window"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Standalone crate: keeps it out of any parent workspace.
[workspace]

[[bin]]
name = "iwae-setup"
path = "src/main.rs"

[features]
# Embeds the NSIS installer and uninstall-ui (release builds only).
payload = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0"

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
