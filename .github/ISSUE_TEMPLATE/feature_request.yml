name: Feature request
description: Propose a focused improvement to IWAE.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading, evidence, or note-taking problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or other approaches you considered.
  - type: checkboxes
    id: local_first
    attributes:
      label: Local-first expectations
      options:
        - label: This proposal can preserve local document ownership and explicit network access.
