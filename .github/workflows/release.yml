name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      IWAE_REQUIRE_UPDATER: '1'
      IWAE_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      IWAE_UPDATER_PUBLIC_KEY: ${{ secrets.IWAE_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force .tmp/pdfium | Out-Null
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile .tmp/pdfium-win-x64.tgz
          tar -xzf .tmp/pdfium-win-x64.tgz -C .tmp/pdfium
          Copy-Item .tmp/pdfium/bin/pdfium.dll src-tauri/binaries/pdfium.dll
      - run: npm ci
      - run: npm run test:release-scripts
      - run: npm test
      - run: npm run release:build
      - run: npm run verify:ocr-dist
      - name: Create signed updater manifest
        shell: pwsh
        run: |
          $bundle = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $bundle) { throw 'NSIS updater bundle was not generated.' }
          $signature = Get-Item "$($bundle.FullName).sig"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $env:IWAE_UPDATER_BUNDLE = $bundle.FullName
          $env:IWAE_UPDATER_SIGNATURE = $signature.FullName
          $env:IWAE_RELEASE_TAG = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$($package.version)" }
          $env:IWAE_UPDATE_PUB_DATE = [DateTime]::UtcNow.ToString('o')
          node scripts/write-update-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: IWAE-Windows-installers-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig
            latest.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig
            latest.json
