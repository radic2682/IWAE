name: Release

# 당분간 릴리즈는 PC 에서 빌드해 올린다(scripts/release-local.mjs). Actions 분 절약을 위해 태그 푸시로는 돌지 않고, 손으로 돌릴 때만 쓴다.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  IWAE_REQUIRE_UPDATER: '1'
  IWAE_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  IWAE_UPDATER_PUBLIC_KEY: ${{ secrets.IWAE_UPDATER_PUBLIC_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PDFium runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force .tmp/pdfium | Out-Null
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile .tmp/pdfium-win-x64.tgz
          tar -xzf .tmp/pdfium-win-x64.tgz -C .tmp/pdfium
          Copy-Item .tmp/pdfium/bin/pdfium.dll src-tauri/binaries/pdfium.dll
      - run: npm ci
      - run: npm run test:release-scripts
      - run: npm test
      - run: npm run release:build
      - run: npm run verify:ocr-dist
      - name: Check updater bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $bundle) { throw 'NSIS updater bundle was not generated.' }
          if (-not (Test-Path "$($bundle.FullName).sig")) { throw 'NSIS updater signature was not generated.' }
      - uses: actions/upload-artifact@v4
        with:
          name: IWAE-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig

  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      # Apple Silicon·Intel 둘 다 되는 universal PDFium
      - run: node scripts/fetch-pdfium.mjs --universal
      - run: npm run release:check
      - run: node scripts/write-updater-config.mjs
      - run: npx tauri build --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json
      - name: Name updater archive by version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-mac
          cp "$bundle"/dmg/*.dmg dist-mac/
          archive=$(ls "$bundle"/macos/*.app.tar.gz | head -n 1)
          cp "$archive" "dist-mac/IWAE_${version}_universal.app.tar.gz"
          cp "$archive.sig" "dist-mac/IWAE_${version}_universal.app.tar.gz.sig"
          ls -la dist-mac
      - uses: actions/upload-artifact@v4
        with:
          name: IWAE-macOS-${{ github.ref_name }}
          if-no-files-found: error
          path: dist-mac/*

  publish:
    needs: [windows-release, macos-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: IWAE-Windows-${{ github.ref_name }}
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: IWAE-macOS-${{ github.ref_name }}
          path: dist/macos
      - name: Create signed updater manifest
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$version"; fi
          IWAE_UPDATER_BUNDLE=$(ls dist/windows/nsis/*-setup.exe | head -n 1) \
          IWAE_UPDATER_MAC_BUNDLE=$(ls dist/macos/*.app.tar.gz | head -n 1) \
          IWAE_RELEASE_TAG="$tag" \
          IWAE_UPDATE_PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          node scripts/write-update-manifest.mjs
          cat latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: IWAE-updater-manifest-${{ github.ref_name }}
          path: latest.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            dist/windows/nsis/*.exe
            dist/windows/msi/*.msi
            dist/windows/**/*.sig
            dist/macos/*.dmg
            dist/macos/*.app.tar.gz
            dist/macos/*.app.tar.gz.sig
            latest.json
